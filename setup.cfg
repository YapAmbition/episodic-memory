[metadata]
name = memory-slice
version = 0.6.0
description = Embeddable event memory with recall, forgetting and maintenance
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = backend
packages = find:
python_requires = >=3.9
install_requires =
    pydantic>=2.10.6,<3
    httpx>=0.28.1,<1
    prometheus-client>=0.21.1,<1

[options.packages.find]
where = backend
include = memory_slice*

[options.extras_require]
server =
    fastapi>=0.115.8,<1
    uvicorn>=0.34.0,<1
